<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wrally</title>
<style>
:root {
  --bg: #ffffff; --soft: #f5f5f7; --surface: #ffffff; --seg: rgba(118, 118, 128, .12); --seg-item: #ffffff;
  --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --line: rgba(0, 0, 0, .08); --line-2: rgba(0, 0, 0, .12);
  --accent: #0071e3; --accent-soft: rgba(0, 113, 227, .10); --accent-2: #bf5af2; --accent-2-soft: rgba(191, 90, 242, .12);
  --warn: #b25000; --warn-dot: #ff9f0a; --warn-bg: #fff4e6; --ok: #1d7a37; --ok-dot: #34c759;
  --bad: #d70015; --bad-bg: rgba(255, 59, 48, .12); --media: #0b1119;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
  --ar: 16 / 9;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --soft: #1c1c1e; --surface: #1c1c1e; --seg: rgba(118, 118, 128, .24); --seg-item: #3a3a3c;
    --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #8e8e93; --line: rgba(255, 255, 255, .11); --line-2: rgba(255, 255, 255, .18);
    --accent: #2997ff; --accent-soft: rgba(41, 151, 255, .16); --accent-2: #da8fff; --accent-2-soft: rgba(218, 143, 255, .16);
    --warn: #ffd60a; --warn-bg: rgba(255, 214, 10, .12); --ok: #30d158; --bad: #ff453a; --bad-bg: rgba(255, 69, 58, .16);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 13px/20px var(--font); -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; margin: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }
.cap {
  color: var(--ink-3); font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
.app { display: flex; flex-direction: column; height: 100vh; }
.wrap { width: 100%; max-width: 1480px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

/* 头部：剧集切换、标题、汇总，右边是播放成片 */
.top { flex: none; display: flex; align-items: flex-end; gap: 16px; padding-top: 12px; padding-bottom: 8px; }
.head-text { min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.eyebrow::-webkit-scrollbar { display: none; }
.eyebrow a {
  color: var(--accent); text-decoration: none; padding: 0 6px; border-radius: 999px; text-transform: uppercase;
  font-size: 10px; line-height: 16px; font-weight: 600; letter-spacing: .06em; white-space: nowrap;
}
.eyebrow a:hover { text-decoration: underline; }
.eyebrow a.back { padding-left: 0; text-transform: none; letter-spacing: 0; font-size: 11px; }
.eyebrow a[aria-current="page"] { background: var(--soft); color: var(--ink); }
.eyebrow .name { white-space: nowrap; }
h1 {
  margin: 3px 0 0; font-size: 25px; line-height: 31px; font-weight: 600; letter-spacing: -.025em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.meta { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.film-btn {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 5px; border-radius: 999px;
  border: .5px solid var(--line-2); background: var(--soft); font-size: 12px; font-weight: 500;
  transition: background-color .18s ease, transform .18s ease;
}
.film-btn:hover { background: var(--line); }
.film-btn:active { transform: scale(.97); }
.film-btn .ico {
  display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); color: #fff;
}
.film-btn .ico svg { width: 8px; height: 8px; margin-left: 1px; }
.film-btn .dur { color: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
svg { fill: currentColor; display: block; }

/* 主体：概览条、筛选，下面三栏 */
.body { flex: 1 1 auto; min-height: 0; padding-bottom: 12px; }
.main {
  height: 100%; display: grid; gap: 12px;
  grid-template-columns: 220px minmax(0, 1fr) 340px; grid-template-rows: auto auto minmax(0, 1fr);
}
.overview {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-radius: 16px;
  background: var(--soft);
}
.ov-main { display: flex; align-items: baseline; gap: 6px; flex: none; }
.pct { font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.pct i { font-style: normal; font-size: 18px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
.track { flex: 1 1 auto; min-width: 70px; height: 4px; border-radius: 999px; overflow: hidden; background: var(--line); }
.track > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.ov-stats { display: flex; align-items: center; gap: 18px; flex: none; }
.stat b { display: block; margin-top: 1px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.stat b.warn { color: var(--warn); }
.chapters { flex: none; display: flex; gap: 10px; font-size: 11px; line-height: 16px; color: var(--ink-3); white-space: nowrap; }
.chapters span.done { color: var(--ink-2); }
.chapters span.done::before { content: "✓"; margin-right: 4px; color: var(--ok); font-weight: 600; }
.chapters span.now { color: var(--ink); font-weight: 500; }
.chapters span.now::before {
  content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%;
  background: var(--accent); vertical-align: 1px;
}

/* 分段控件：白色滑块跟着选中项平移 */
.seg { position: relative; display: flex; width: 100%; padding: 2px; border-radius: 11px; background: var(--seg); }
.seg.filters { grid-column: 1 / -1; max-width: 600px; }
.seg-thumb {
  position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0; border-radius: 9px; background: var(--seg-item); opacity: 0;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .14), 0 0 0 .5px rgba(0, 0, 0, .05);
  transition: left .3s cubic-bezier(.32, .72, 0, 1), width .3s cubic-bezier(.32, .72, 0, 1), opacity .2s ease;
}
.seg-item {
  position: relative; z-index: 1; flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center;
  gap: 5px; height: 28px; padding: 0 6px; border-radius: 9px; color: var(--ink-2); font-size: 12px; font-weight: 500;
  white-space: nowrap; overflow: hidden; transition: color .2s ease;
}
.seg-item:hover, .seg-item[aria-pressed="true"] { color: var(--ink); }
.seg-item i { font-style: normal; font-size: 10px; line-height: 14px; color: var(--ink-3); }
.web-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.web-dot.differs { background: var(--warn-dot); }

/* 左栏：镜头列表，自己纵向滚动 */
.shots { min-height: 0; overflow: hidden; }
.rail {
  display: flex; flex-direction: column; gap: 2px; height: 100%; overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
}
.rail-empty { padding: 16px 6px; color: var(--ink-3); font-size: 12px; }
.shot {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 7px; border-radius: 10px; text-align: left;
  transition: background-color .18s ease;
}
.shot:hover { background: var(--soft); }
.shot[aria-current="true"] { background: var(--accent-soft); }
.shot.cut { opacity: .5; }
.thumb { position: relative; flex: 0 0 56px; width: 56px; height: 32px; overflow: hidden; border-radius: 8px; background: var(--soft); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb .dot {
  position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3);
  box-shadow: 0 0 0 2px var(--bg);
}
.dot.ok { background: var(--ok-dot); }
.dot.warn { background: var(--warn-dot); }
.dot.bad { background: var(--bad); }
.dot.run { background: var(--accent); }
.thumb .has-video {
  position: absolute; left: 3px; bottom: 3px; width: 12px; height: 12px; border-radius: 50%; background: rgba(0, 0, 0, .5);
  display: flex; align-items: center; justify-content: center;
}
.thumb .has-video::before {
  content: ""; margin-left: 1px; border-left: 4px solid #fff; border-top: 3px solid transparent; border-bottom: 3px solid transparent;
}
.shot-cap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.shot-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
.shot-key { flex: none; font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.shot-name { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 16px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot-meta { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--ink-3); font-size: 10px; line-height: 14px; white-space: nowrap; overflow: hidden; }
.mode { padding: 0 4px; border-radius: 4px; background: var(--line); color: var(--ink-2); font-size: 9px; line-height: 14px; font-weight: 600; }
.mode.pair { background: var(--accent-2-soft); color: var(--accent-2); }
.shot-meta .warn { color: var(--warn); font-weight: 600; }
.shot-meta .bad { color: var(--bad); font-weight: 600; }

/* 中栏：这一镜的画面、规格、提醒和候选 */
.detail, .info {
  min-width: 0; min-height: 0; overflow: hidden; border-radius: 18px; background: var(--surface);
  box-shadow: var(--shadow), 0 0 0 .5px var(--line);
}
.detail { display: flex; flex-direction: column; padding: 14px; }
.dhead { flex: none; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.dhead-main { flex: 1 1 auto; min-width: 0; }
.dhead-side { display: flex; align-items: center; gap: 6px; flex: none; }
.cap .pair { color: var(--accent-2); }
.dtitle {
  margin: 2px 0 0; font-size: 19px; line-height: 24px; font-weight: 600; letter-spacing: -.02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dtitle.none { color: var(--ink-3); font-weight: 500; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 999px; white-space: nowrap;
  font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--soft);
}
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.badge.bad { color: var(--bad); background: var(--bad-bg); }
.badge.run { color: var(--accent); background: var(--accent-soft); }
.ref-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 3px; border-radius: 999px;
  border: .5px solid var(--line-2); background: var(--soft); color: var(--ink-2); font-size: 10px; font-weight: 500;
}
.ref-chip:hover { background: var(--line); }
.ref-stack { display: flex; padding-left: 2px; }
.ref-stack > * {
  width: 16px; height: 16px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--bg); margin-left: -5px;
  background: var(--line-2);
}
.ref-stack > :first-child { margin-left: 0; }

.frame {
  position: relative; flex: 1 1 auto; min-height: 160px; overflow: hidden; border-radius: 12px; background: var(--media);
  display: flex; align-items: center; justify-content: center;
}
.frame > img, .frame > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.frame > img { cursor: zoom-in; }
.frame-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: var(--soft); color: var(--ink-2); font-size: 12px; text-align: center; padding: 12px;
}
.frame-empty .sub { color: var(--ink-3); font-size: 11px; }
.pairs {
  position: absolute; inset: 0; padding: 40px 14px 14px; display: grid; gap: 10px; align-items: center;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-rows: 100%;
}
.pair-item { min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pair-item img, .pair-item .missing {
  display: block; max-width: 100%; max-height: calc(100% - 20px); aspect-ratio: var(--ar); object-fit: contain;
  border: 1.5px solid var(--accent); border-radius: 10px; cursor: zoom-in; background: #000;
}
.pair-item.end img, .pair-item.end .missing { border-color: var(--accent-2); }
.pair-item .missing { width: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, .6); cursor: default; font-size: 12px; }
.pair-cap { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: rgba(255, 255, 255, .75); font-size: 10px; line-height: 14px; }
.pair-arrow { color: rgba(255, 255, 255, .55); font-size: 12px; }
.kf-tag { padding: 0 4px; border-radius: 4px; font-size: 9px; line-height: 14px; font-weight: 600; color: #fff; background: var(--accent); }
.kf-tag.end { background: var(--accent-2); }
.glass {
  position: absolute; z-index: 4; border-radius: 9px; background: rgba(20, 20, 22, .52);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.media-mode { top: 8px; left: 8px; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 7px; color: rgba(255, 255, 255, .86); font-size: 10px; font-weight: 500; pointer-events: none; }
.media-switch { top: 8px; right: 8px; display: inline-flex; gap: 2px; padding: 2px; }
.media-switch button { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 7px; color: rgba(255, 255, 255, .8); font-size: 11px; }
.media-switch button[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: #1d1d1f; }
.media-switch button:disabled { opacity: .4; cursor: default; }
.play-badge {
  position: absolute; right: 10px; bottom: 10px; z-index: 3; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .92); color: #1d1d1f;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .3); transition: transform .2s ease;
}
.play-badge:hover { transform: scale(1.06); }
.play-badge svg { width: 13px; height: 13px; margin-left: 2px; }

.specs { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; padding-top: 8px; border-top: .5px solid var(--line); }
.spec { min-width: 0; padding-right: 12px; }
.spec + .spec { padding-left: 12px; border-left: .5px solid var(--line); }
.spec b { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spec b.idle { color: var(--ink-3); font-weight: 500; }
.spec b.warn { color: var(--warn); }
.spec b.bad { color: var(--bad); }
.spec b.run { color: var(--accent); }
.spec .s { display: block; margin-top: 1px; color: var(--ink-2); font-size: 10px; line-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.alerts { flex: none; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 96px; overflow-y: auto; }
.alert { display: flex; align-items: flex-start; gap: 9px; padding: 7px 10px; border-radius: 12px; font-size: 11px; line-height: 16px; background: var(--soft); color: var(--ink-2); text-align: left; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert .glyph {
  flex: 0 0 15px; width: 15px; height: 15px; margin-top: 1px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: currentColor; font-size: 9px; line-height: 1; font-weight: 700;
}
.alert .glyph::after { content: attr(data-g); color: var(--bg); }
.alert strong { font-weight: 600; }
.alert span.t { opacity: .85; }
button.alert:hover { filter: brightness(.97); }

.cands-head { flex: none; display: flex; align-items: baseline; gap: 8px; margin: 10px 0 6px; }
.cands-head .pick { margin-left: auto; color: var(--ink-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { height: 0; }
.cand {
  position: relative; flex: none; height: 58px; aspect-ratio: var(--ar); overflow: hidden; border: 2px solid transparent;
  border-radius: 10px; background: var(--soft); transition: transform .16s ease;
  display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 10px;
}
button.cand:hover { transform: translateY(-1px); }
.cand img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cand.picked { border-color: var(--accent); }
.cand.last { border-color: var(--accent-2); }
.cand.suggested { border-color: var(--warn-dot); }
.cand.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.cand .a { position: absolute; left: 5px; bottom: 2px; color: #fff; font-size: 10px; line-height: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.cand .m { position: absolute; top: 3px; right: 3px; padding: 0 4px; border-radius: 5px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 9px; line-height: 13px; }
.cand.picked .m { background: var(--accent); }
.cand.last .m { background: var(--accent-2); }
.cand.suggested .m { background: var(--warn-dot); color: #1d1d1f; }
.empty-cands { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px; border-radius: 12px; background: var(--soft); color: var(--ink-2); font-size: 12px; }
.empty-cands .sub { color: var(--ink-3); font-size: 11px; }
.detail.cut .frame, .detail.cut .strip { opacity: .5; }

/* 右栏：提示词、台词与旁白、检查 */
.info { display: flex; flex-direction: column; padding: 8px 16px 12px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.block { padding: 8px 0; }
.block + .block { border-top: .5px solid var(--line); }
.block > .cap { margin-bottom: 5px; }
.prompts { display: flex; flex-direction: column; gap: 4px; }
.prow {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px; align-items: start; width: 100%;
  padding: 4px 4px 4px 0; border-radius: 7px; text-align: left; transition: background-color .16s ease;
}
.prow:hover { background: var(--soft); }
.prow .k { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 10px; line-height: 16px; font-weight: 600; padding-top: 1px; }
.prow .txt { font-size: 11px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; max-height: 48px; overflow: hidden; overflow-wrap: anywhere; }
.prow .more { color: var(--accent); font-size: 10px; line-height: 16px; font-weight: 500; white-space: nowrap; padding-top: 1px; }
.muted { color: var(--ink-3); font-size: 11px; }
.quote { margin: 0; font-size: 13px; line-height: 20px; letter-spacing: -.005em; }
.quote.none { color: var(--ink-3); }
.audio { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.audio-play {
  flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff;
}
.audio-play svg { width: 11px; height: 11px; }
.audio-track { flex: 1 1 auto; height: 16px; display: flex; align-items: center; cursor: pointer; }
.audio-track > span { position: relative; display: block; width: 100%; height: 3px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.audio-track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 2px; }
.audio-time { flex: none; color: var(--ink-2); font-size: 10px; line-height: 14px; font-variant-numeric: tabular-nums; }
.audio-empty { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--soft); color: var(--ink-2); font-size: 11px; }
.checks { display: flex; flex-direction: column; }
.check { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: .5px solid var(--line); font-size: 11px; line-height: 16px; }
.check:last-child { border-bottom: 0; }
.check .k { color: var(--ink-2); flex: none; }
.check .n { flex: 1 1 auto; min-width: 0; color: var(--ink-3); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.check .v { flex: none; font-weight: 500; }
.v.ok { color: var(--ok); }
.v.warn { color: var(--warn); }
.v.bad { color: var(--bad); }
.v.run { color: var(--accent); }
.v.idle { color: var(--ink-3); font-weight: 400; }
.info-foot { margin-top: auto; padding-top: 8px; border-top: .5px solid var(--line); color: var(--ink-3); font-size: 10px; line-height: 14px; }

/* 底栏 */
.foot { flex: none; display: flex; align-items: center; gap: 6px; min-height: 34px; padding-top: 8px; padding-bottom: 8px; border-top: .5px solid var(--line); color: var(--ink-3); font-size: 11px; line-height: 16px; }
.ro { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.ro::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.grow { flex: 1 1 auto; }
.foot .fresh button { background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 11px; }
.foot .note { color: var(--warn); }
kbd { font: 10px ui-monospace, "SF Mono", monospace; background: var(--soft); border: .5px solid var(--line-2); border-radius: 4px; padding: 0 4px; }

/* 浮层：提示词全文、参考图、候选大图、成片。共用一个遮罩，只有浮层正文会滚动 */
.modal-host { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-host.open {
  display: flex; background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px) } to { opacity: 1; transform: none } }
.modal {
  width: min(640px, 100%); max-height: 90vh; display: flex; flex-direction: column; padding: 18px; border-radius: 22px;
  background: var(--bg); color: var(--ink); box-shadow: 0 30px 90px rgba(0, 0, 0, .42), 0 0 0 .5px var(--line);
  animation: pop .24s cubic-bezier(.2, .7, .2, 1);
}
.modal.wide { width: min(980px, 100%); padding: 16px; }
.modal-head { flex: none; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.modal-title { margin: 3px 0 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.close {
  margin-left: auto; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--ink-2);
  font-size: 17px; line-height: 1;
}
.close:hover { background: var(--line); color: var(--ink); }
.modal .seg { flex: none; max-width: 360px; margin-bottom: 12px; }
.modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
.prompt { margin: 0; font-size: 13px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt .common { color: var(--ink-3); }
.prompt-note { margin: 8px 0 0; font-size: 12px; color: var(--warn); }
.web-note { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 18px; background: var(--accent-soft); }
.web-note.differs { background: var(--warn-bg); color: var(--warn); }
.modal-foot {
  flex: none; display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: .5px solid var(--line);
  color: var(--ink-3); font-size: 11px; line-height: 16px; flex-wrap: wrap;
}
.copy { color: var(--accent); font-size: 11px; font-weight: 500; white-space: nowrap; }
.cmd { display: inline-flex; align-items: center; gap: 8px; }
.cmd code { font: 11px ui-monospace, "SF Mono", monospace; color: var(--ink); background: var(--soft); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.ref-card { min-width: 0; padding: 8px; border-radius: 12px; background: var(--soft); }
.ref-card .pic { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: var(--ar); border-radius: 8px; background: var(--media); color: rgba(255, 255, 255, .55); font-size: 11px; overflow: hidden; }
.ref-card .pic img { width: 100%; height: 100%; object-fit: contain; }
.ref-name { margin-top: 6px; font-size: 12px; line-height: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: var(--ink-3); font-size: 10px; line-height: 14px; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--line); color: var(--ink-2); font-size: 10px; font-weight: 600; white-space: nowrap; }
.tag.start { background: var(--accent-soft); color: var(--accent); }
.tag.end { background: var(--accent-2-soft); color: var(--accent-2); }
.tag.suggested { background: var(--warn-bg); color: var(--warn); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: 14px; background: #05070a; display: flex; justify-content: center; }
.stage img, .stage video { display: block; max-width: 100%; max-height: 66vh; object-fit: contain; }
.stage video { width: 100%; }
.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .9); color: #1d1d1f; font-size: 20px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
}
.nav-btn:disabled { opacity: .25; cursor: default; }
.nav-btn.prev { left: 12px; }
.nav-btn.next { right: 12px; }
.lb-meta { flex: none; display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.lb-meta .note { color: var(--ink-2); font-size: 12px; }
.lb-thumbs { flex: none; display: flex; gap: 6px; margin-top: 10px; padding: 10px 2px 2px; border-top: .5px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.lb-thumbs .cand { height: 40px; border-radius: 7px; }

/* 窄窗口：一栏往下排，整页滚动，镜头列表横着滑 */
@media (max-width: 899px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .wrap { padding-left: 14px; padding-right: 14px; }
  .top { flex-direction: column; align-items: stretch; gap: 3px; }
  .head-right { margin-left: 0; justify-content: space-between; }
  .main { height: auto; display: flex; flex-direction: column; gap: 10px; }
  .overview { flex-wrap: wrap; gap: 8px 12px; }
  .track { order: 2; flex: 1 1 100%; }
  .ov-stats { order: 3; width: 100%; justify-content: space-between; gap: 12px; }
  .chapters { order: 4; flex-wrap: wrap; gap: 3px 10px; white-space: normal; }
  .seg.filters { max-width: none; }
  .shots { overflow: visible; }
  .rail { flex-direction: row; height: auto; gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 2px 0 4px; scrollbar-width: none; }
  .shot { flex: 0 0 112px; width: 112px; min-width: 0; flex-direction: column; align-items: stretch; gap: 5px; padding: 0; }
  .shot[aria-current="true"] { background: transparent; }
  .shot[aria-current="true"] .thumb { box-shadow: 0 0 0 2px var(--accent); }
  .shot[aria-current="true"] .shot-key { color: var(--accent); }
  .thumb { flex: none; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 11px; }
  .shot-meta { display: none; }
  .frame { flex: none; aspect-ratio: var(--ar); max-height: 70vh; min-height: 0; }
  .alerts { max-height: none; }
  .info { overflow: visible; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top wrap" id="top"></header>
  <div class="body wrap">
    <div class="main">
      <section class="overview" id="overview"></section>
      <nav class="seg filters" id="filters" aria-label="镜头筛选"></nav>
      <div class="shots"><div class="rail" id="rail"></div></div>
      <article class="detail" id="detail"></article>
      <aside class="info" id="info"></aside>
    </div>
  </div>
  <footer class="foot wrap" id="foot"></footer>
</div>
<div class="modal-host" id="modal"></div>
<script id="data" type="application/json">__WRALLY_DATA__</script>
<script>
(() => {
  const VERSION = "__WRALLY_VERSION__";
  const data = JSON.parse(document.getElementById("data").textContent);
  const KINDS = [["keyframe", "关键帧"], ["video", "视频"], ["audio", "旁白"]];
  const PROMPTS = [["image", "图片", "图片提示词"], ["anim", "动画", "动画提示词"], ["audio", "旁白", "旁白提示词"]];
  const SETTLED = ["done", "skipped"];
  const BAD = ["failed", "stale", "missing"];
  // 状态 → 颜色：ok 绿、warn 橙、bad 红、run 蓝、idle 灰
  const TONE = { done: "ok", skipped: "ok", pending: "warn", stale: "warn", missing: "warn", failed: "bad", running: "run", none: "idle", cut: "idle" };

  // 所有文字都经 textContent 写入，提示词里的任何字符都不会被当成标签
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (name === "class") node.className = value;
      else if (name === "text") node.textContent = value;
      else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
      else node.setAttribute(name, value === true ? "" : value);
    }
    for (const child of children.flat()) if (child) node.append(child);
    return node;
  }
  // 换掉 node 的全部子节点；null、false 这些空位跳过（replaceChildren 会把它们写成文字）
  const put = (node, ...children) => node.replaceChildren(...children.flat().filter(Boolean));
  const PATHS = { play: "M4.2 2.1 13.6 8l-9.4 5.9z", pause: "M3.4 2.4h3.2v11.2H3.4zM9.4 2.4h3.2v11.2H9.4z" };
  function icon(name) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", PATHS[name]);
    svg.append(path);
    return svg;
  }
  const fmt = t => { const v = Math.max(0, Math.floor(t || 0)); return Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0"); };

  const stateOf = (shot, kind) => shot[kind].status.state;
  const webDiffers = shot => Object.values(shot.prompts).some(p => p && p.web === "differs");
  const isOpen = shot => !shot.cut
    && (webDiffers(shot) || KINDS.some(([kind]) => !SETTLED.includes(stateOf(shot, kind))));
  const needsWork = shot => !shot.cut && (webDiffers(shot) || KINDS.some(([kind]) => BAD.includes(stateOf(shot, kind))));
  const hasState = state => shot => !shot.cut && KINDS.some(([kind]) => stateOf(shot, kind) === state);
  const isPair = shot => Boolean(shot.keyframe.last);
  function worst(shot) {
    if (shot.cut) return "cut";
    const states = KINDS.map(([kind]) => stateOf(shot, kind));
    for (const s of ["failed", "stale", "missing", "running", "pending", "none"]) if (states.includes(s)) return s;
    return webDiffers(shot) ? "stale" : "done";
  }
  function badge(shot) {
    const w = worst(shot);
    if (w === "cut") return ["不进成片", "idle"];
    if (w === "done") return ["完成", "ok"];
    if (w === "stale" && KINDS.every(([kind]) => SETTLED.includes(stateOf(shot, kind)))) return ["网页副本不同", "warn"];
    const [kind, label] = KINDS.find(([k]) => stateOf(shot, k) === w);
    return [`${label}${shot[kind].status.label}`, TONE[w]];
  }
  // 画面位置放哪张：选用图；没选时放推荐的那张
  function cover(shot) {
    const kf = shot.keyframe;
    if (kf.src) return kf.src;
    const hinted = kf.candidates.find(c => c.suggested && c.src);
    return !kf.pick && hinted ? hinted.src : null;
  }
  const live = data.shots.filter(s => !s.cut);  // 不进成片的镜头不算进度

  // 画面比例：取载入的图或视频的实际宽高
  let shape = null;
  function setShape(value) {
    if (!value || value === shape) return;
    shape = value;
    document.documentElement.style.setProperty("--ar", value);
    document.documentElement.classList.toggle("portrait", Number(value) < 1);
  }
  function orient(e) {
    const m = e.target;
    const w = m.naturalWidth || m.videoWidth, h = m.naturalHeight || m.videoHeight;
    if (w && h) setShape(String(Math.round(w / h * 1000) / 1000));
  }

  // 只滚动 box 自己，把 item 露出来。scrollIntoView 会连带整页一起滚
  function revealIn(box, item) {
    if (!item) return;
    const b = box.getBoundingClientRect(), r = item.getBoundingClientRect();
    box.scrollLeft += r.left < b.left ? r.left - b.left : r.right > b.right ? r.right - b.right : 0;
    box.scrollTop += r.top < b.top ? r.top - b.top : r.bottom > b.bottom ? r.bottom - b.bottom : 0;
  }

  function copyButton(text, label) {
    const button = el("button", { class: "copy", text: label, onclick: e => {
      e.stopPropagation();
      navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
        button.textContent = "已复制";
        setTimeout(() => { button.textContent = label; }, 1500);
      });
    } });
    return button;
  }
  const command = (text, label) => el("span", { class: "cmd" }, el("code", { title: "在单集目录下运行", text }), copyButton(text, label));

  // 分段控件：滑块挪到选中的那一项下面
  function syncSegs() {
    for (const seg of document.querySelectorAll(".seg")) {
      const thumb = seg.querySelector(".seg-thumb"), item = seg.querySelector('.seg-item[aria-pressed="true"]');
      if (!thumb) continue;
      thumb.style.opacity = item ? "1" : "0";
      if (item) { thumb.style.left = item.offsetLeft + "px"; thumb.style.width = item.offsetWidth + "px"; }
    }
  }
  function segment(items, chosen, onpick) {
    return [el("span", { class: "seg-thumb", "aria-hidden": "true" }), ...items.map(([value, ...label]) =>
      el("button", { class: "seg-item", "data-value": value, "aria-pressed": String(value === chosen),
        onclick: () => onpick(value) }, ...label))];
  }
  function pressSeg(seg, value) {
    for (const b of seg.querySelectorAll(".seg-item")) b.setAttribute("aria-pressed", String(b.dataset.value === value));
    syncSegs();
  }

  // ---- 头部 -------------------------------------------------------------------
  document.title = [data.name.toUpperCase(), data.title].filter(Boolean).join(" · ");
  const counts = Object.fromEntries(KINDS.map(([kind]) => {
    const wanted = live.filter(s => stateOf(s, kind) !== "skipped");
    return [kind, [wanted.filter(s => stateOf(s, kind) === "done").length, wanted.length]];
  }));
  const filmButton = data.film && el("button", { class: "film-btn", title: "播放整集成片", onclick: () => openFilm() },
    el("span", { class: "ico" }, icon("play")), el("span", { text: "播放成片" }), el("span", { class: "dur" }));
  if (filmButton) {
    const probe = el("video", { src: data.film, preload: "metadata", muted: true });
    probe.addEventListener("loadedmetadata", () => { filmButton.querySelector(".dur").textContent = fmt(probe.duration); });
  }
  document.getElementById("top").append(
    el("div", { class: "head-text" },
      el("div", { class: "eyebrow cap" },
        data.index && el("a", { class: "back", href: data.index, text: "‹ 全部剧集" }),
        data.index ? data.episodes.map(name => el("a", { href: `../${encodeURIComponent(name)}/page.html`, text: name,
          "aria-current": name === data.name ? "page" : null })) : el("span", { class: "name", text: data.name })),
      el("h1", { text: data.title || data.name })),
    el("div", { class: "head-right" },
      el("p", { class: "meta", text: [`${live.length} 镜`, ...KINDS.map(([k, l]) => `${l} ${counts[k].join("/")}`)].join(" · ") }),
      filmButton));

  // ---- 概览条：整体进度、当前阶段、要处理的镜头、生成方式、各阶段 -----------------
  (() => {
    let done = 0, total = 0;
    for (const [kind] of KINDS) { done += counts[kind][0]; total += counts[kind][1]; }
    const pct = total ? Math.round(done / total * 100) : 0;
    const kfWanted = live.filter(s => stateOf(s, "keyframe") !== "skipped");
    const need = (s, kind, p) => stateOf(s, kind) === "skipped" || Boolean(s.prompts[p]);
    const stages = [
      ["提示词", live.filter(s => need(s, "keyframe", "image") && need(s, "video", "anim")).length, live.length],
      ["关键帧", kfWanted.filter(s => s.keyframe.candidates.length || s.keyframe.src || s.keyframe.pick).length, kfWanted.length],
      ["选图", kfWanted.filter(s => ["done", "missing"].includes(stateOf(s, "keyframe"))).length, kfWanted.length],
      ["视频", ...counts.video], ["旁白", ...counts.audio], ["成片", data.film ? 1 : 0, 1],
    ];
    const now = stages.find(([, a, b]) => a < b);
    const flagged = live.filter(needsWork).length;
    const pairs = live.filter(isPair).length;
    document.getElementById("overview").append(
      el("div", { class: "ov-main" }, el("span", { class: "pct" }, String(pct), el("i", { text: "%" })), el("span", { class: "cap", text: "整体进度" })),
      el("div", { class: "track", role: "progressbar", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100 },
        el("i", { style: `width:${pct}%` })),
      el("div", { class: "ov-stats" },
        el("div", { class: "stat" }, el("span", { class: "cap", text: "当前阶段" }), el("b", { text: now ? `${now[0]} ${now[1]}/${now[2]}` : "全部完成" })),
        el("div", { class: "stat" }, el("span", { class: "cap", text: "需要处理" }),
          el("b", { class: flagged || data.note ? "warn" : null, text: data.note ? "公共文本读取失败" : flagged ? `${flagged} 镜` : "没有" })),
        el("div", { class: "stat" }, el("span", { class: "cap", text: "生成方式" }), el("b", { text: `首尾帧 ${pairs} · 单图 ${live.length - pairs}` }))),
      el("div", { class: "chapters" }, stages.map(([name, a, b]) =>
        el("span", { class: a >= b ? "done" : now && now[0] === name ? "now" : null, title: `${name} ${a}/${b}`, text: name }))));
  })();

  // ---- 筛选和镜头列表 ---------------------------------------------------------
  const FILTERS = [["all", "全部", () => true], ["open", "未完成", isOpen], ["warn", "需处理", needsWork],
    ["running", "生成中", hasState("running")], ["failed", "失败", hasState("failed")]];
  const current = { filter: "all", key: null, media: "keyframe" };
  const shown = () => data.shots.filter((FILTERS.find(([f]) => f === current.filter) || FILTERS[0])[2]);
  const byKey = new Map(data.shots.map(s => [s.key, s]));
  const filters = document.getElementById("filters");
  filters.append(...segment(FILTERS.map(([value, label, test]) => [value, label, el("i", { text: String(data.shots.filter(test).length) })]),
    current.filter, value => applyFilter(value)));

  const rail = document.getElementById("rail");
  function railItem(shot) {
    const kf = shot.keyframe;
    const thumb = cover(shot) || (kf.candidates.find(c => c.src) || {}).src;
    const [label, tone] = badge(shot);
    return el("button", { class: "shot" + (shot.cut ? " cut" : ""), "data-shot": shot.key, "data-open": isOpen(shot) ? "1" : "0",
      "aria-current": String(shot.key === current.key), title: `${shot.key} · ${label}`, onclick: () => focusShot(shot.key) },
      el("span", { class: "thumb" }, thumb && el("img", { src: thumb, alt: "", loading: "lazy" }),
        el("span", { class: "dot " + tone }), shot.video.src && el("span", { class: "has-video" })),
      el("span", { class: "shot-cap" },
        el("span", { class: "shot-line" }, el("span", { class: "shot-key", text: shot.key }),
          el("span", { class: "shot-name", text: shot.narration || "（没有台词）" })),
        el("span", { class: "shot-meta" }, el("span", { class: "mode" + (isPair(shot) ? " pair" : ""), text: isPair(shot) ? "首尾帧" : "单图" }),
          tone === "ok" ? el("span", { text: label }) : el("span", { class: tone === "bad" ? "bad" : tone === "warn" ? "warn" : null, text: label }))));
  }
  function drawRail() {
    const list = shown();
    put(rail, ...(list.length ? list.map(railItem) : [el("div", { class: "rail-empty", text: "这一筛选下没有镜头" })]));
    revealIn(rail, rail.querySelector('[aria-current="true"]'));
  }
  function applyFilter(which) {
    current.filter = which;
    pressSeg(filters, which);
    const list = shown();
    drawRail();
    // 当前这镜被筛掉了：换到后面第一个还在的，后面没有就取最后一个
    if (list.length && !list.some(s => s.key === current.key)) {
      const at = data.shots.findIndex(s => s.key === current.key);
      focusShot((list.find(s => data.shots.indexOf(s) > at) || list[list.length - 1]).key);
    }
  }

  // ---- 浮层 ---------------------------------------------------------------------
  const host = document.getElementById("modal");
  let modal = null;  // 打开着的浮层：{ step, kind }
  function openModal(node, extra) {
    for (const m of document.querySelectorAll("video, audio")) m.pause();
    put(host, node);
    host.classList.add("open");
    modal = extra || {};
    syncSegs();
    const button = host.querySelector(".close");
    if (button) button.focus({ preventScroll: true });
  }
  function closeModal() {
    if (!modal) return;
    host.classList.remove("open");
    put(host);
    modal = null;
  }
  host.addEventListener("click", e => { if (e.target === host) closeModal(); });
  const head = (eyebrow, title) => el("div", { class: "modal-head" },

    put(info);
  }

  // 一次只响一个：开始播放时停掉其他的
  document.addEventListener("play", e => {
    for (const m of document.querySelectorAll("video, audio")) if (m !== e.target) m.pause();
  }, true);

  // 键盘：J / K 上下一镜，V 换关键帧 / 视频；大图里左右换候选；Esc 关浮层
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (modal) {
      if (e.key === "Escape") closeModal();
      else if (modal.step && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); modal.step(e.key === "ArrowRight" ? 1 : -1); }
      return;
    }
    // 焦点在播放器上时，按键留给它
    if (e.target instanceof Element && e.target.matches("video, audio")) return;
    const step = { j: 1, k: -1 }[e.key.toLowerCase()];
    if (step) {
      const list = shown(), at = list.findIndex(s => s.key === current.key);
      const next = list[Math.min(list.length - 1, Math.max(0, at + step))];
      if (next && next.key !== current.key) focusShot(next.key);
    } else if (e.key.toLowerCase() === "v") {
      const shot = byKey.get(current.key);
      if (shot && shot.video.src) setMedia(current.media === "video" ? "keyframe" : "video");
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const shot = byKey.get(current.key);
      if (!shot) return;
      e.preventDefault();
      const items = candidates(shot), src = cover(shot);
      openCand(shot, Math.max(0, items.findIndex(c => c.src === src)));
    }
  });

  // ---- 底栏 ---------------------------------------------------------------------
  const fresh = el("span", { class: "fresh" });
  const running = live.filter(hasState("running")).length;
  put(document.getElementById("foot"), el("span", { class: "ro", text: "只读视图" }), el("span", { text: "·" }), fresh,
    data.note && el("span", { class: "note", text: "· 公共文本读取失败：" + data.note }),
    el("span", { class: "grow" }), el("span", { text: running ? `${running} 镜生成中` : "无进行中任务" }),
    el("span", { class: "keys" }, " · ", el("kbd", { text: "J" }), " ", el("kbd", { text: "K" }), " 上下一镜 ",
      el("kbd", { text: "V" }), " 视频 ", el("kbd", { text: "←" }), " ", el("kbd", { text: "→" }), " 候选大图"));

  // 刷新前后保持筛选、当前镜头、关键帧 / 视频和正在看的那张候选
  const STORE = "wrally-page:" + location.pathname;
  window.addEventListener("pagehide", () => {
    try {
      sessionStorage.setItem(STORE, JSON.stringify({
        filter: current.filter, key: current.key, media: current.media, shape,
        cand: modal && modal.step ? current.cand : null,
      }));
    } catch (e) { /* 浏览器不给用就算了 */ }
  });
  (() => {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(STORE) || "null"); } catch (e) { /* 同上 */ }
    if (saved) {
      current.media = saved.media === "video" ? "video" : "keyframe";
      setShape(saved.shape);
    }
    const hash = location.hash.replace(/^#s?/, "");
    current.key = saved && byKey.has(saved.key) ? saved.key : byKey.has(hash) ? hash : null;
    current.filter = saved && FILTERS.some(([f]) => f === saved.filter) ? saved.filter : "all";
    pressSeg(filters, current.filter);
    drawRail();
    const list = shown();
    const start = byKey.get(current.key) || list[0] || data.shots[0];
    if (!start) { nothing(); return; }
    focusShot(start.key);
    if (saved && saved.cand !== null && saved.cand !== undefined) {
      const items = candidates(start), at = items.findIndex(c => c.label === saved.cand);
      if (at >= 0) openCand(start, at);
    }
  })();
  requestAnimationFrame(syncSegs);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncSegs);
  window.addEventListener("resize", syncSegs);

  // 发现更新：file:// 下不能 fetch，所以定时用 script 标签加载版本文件，它会调用 __wrallyPage
  const stamp = new Date(document.lastModified);
  if (!isNaN(stamp)) fresh.textContent = "更新于 " + stamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  let offered = false;
  const busy = () => (modal && !modal.step) || [...document.querySelectorAll("video, audio")].some(m => !m.paused && !m.ended);
  window.__wrallyPage = version => {
    if (version === VERSION) return;
    if (!busy()) { location.reload(); return; }
    if (offered) return;
    offered = true;  // 正在播放或看提示词全文时不打断，等人来点
    put(fresh, el("button", { text: "有更新 · 点击刷新", onclick: () => location.reload() }));
  };
  setInterval(() => {
    const probe = el("script", { src: ".wrally/page.version.js?t=" + Date.now() });
    probe.onload = probe.onerror = () => probe.remove();
    document.head.append(probe);
  }, 3000);
})();
</script>
</body>
</html>
